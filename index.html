<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- user-scalable=no hands pinch/pan entirely to the canvas's own touch
     handlers -- without this the page itself would ALSO natively
     pinch-zoom/pan at the same time as the app's custom gesture code,
     fighting it. Without width=device-width at all, mobile browsers fake
     a ~980px viewport and scale the whole page down instead of laying it
     out at the real screen width. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solar System — Orbital Mechanics Visualizer</title>
<!-- Inline SVG data URI, not a separate file -- avoids the browser's
     automatic /favicon.ico request 404ing (a plain static file server
     doesn't rewrite that to anything real). Colors match the app's own
     palette: dark panel background, gold Sun, blue accent planet. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f1a'/%3E%3Cellipse cx='16' cy='17' rx='12' ry='6' fill='none' stroke='%233a4a6b' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='14' r='4.2' fill='%23ffd27a'/%3E%3Ccircle cx='26' cy='17' r='2.1' fill='%235ab0ff'/%3E%3C/svg%3E">
<!-- ?v= cache-buster on both src/js/app.js and src/css/style.css below --
     bump the number on any edit to either file. Both were being served
     with no explicit cache headers, so browsers were free to keep
     serving an old cached copy across normal (non-hard) reloads, which
     is the likely cause of "my fix isn't showing up" reports where the
     source itself checks out fine (verified content missing on some
     panels but not others, exactly the kind of partial staleness a
     cached JS file mid-series-of-edits would produce). -->
<link rel="stylesheet" href="src/css/style.css?v=18">
</head>
<body>

<div id="canvas-wrap">
  <canvas id="scene"></canvas>
</div>

<div id="hover-tip"></div>

<!-- Mobile-only: hidden on desktop (see body.mobile rules in style.css).
     Legend becomes a slide-out drawer on mobile instead of an
     always-visible floating box -- this button plus the backdrop below
     are its open/close affordances. -->
<button id="legend-drawer-toggle" title="Show legend" aria-label="Show legend">
  <span class="drawer-toggle-bar"></span>
  <span class="drawer-toggle-bar"></span>
  <span class="drawer-toggle-bar"></span>
</button>
<div id="legend-backdrop"></div>

<div class="panel" id="legend-panel">
  <div class="layer-group" id="planets-layer-group">
    <div class="layer-header" id="planets-layer-header">
      <span class="chevron"></span><span>Planets</span>
    </div>
    <div class="layer-body" id="planets-layer-body">
      <div id="legend-rows"></div>
    </div>
  </div>
  <div class="layer-group collapsed" id="flights-layer-group">
    <div class="layer-header" id="flights-layer-header">
      <span class="chevron"></span><span>Flights</span>
    </div>
    <div class="layer-body" id="flights-layer-body">
      <div id="flights-rows"></div>
    </div>
  </div>
  <div class="layer-group collapsed" id="smallbodies-layer-group">
    <div class="layer-header" id="smallbodies-layer-header">
      <span class="chevron"></span><span>Small Bodies</span>
    </div>
    <div class="layer-body" id="smallbodies-layer-body">
      <div id="smallbodies-rows"></div>
    </div>
  </div>
</div>

<div class="panel" id="scale-toggle-panel">
  <label id="size-toggle-label">
    <div class="switch" id="size-switch"></div>
    <span>Compare true sizes</span>
  </label>
  <label id="focus-toggle-label" title="Broad: everything currently in transit shows. Focused: only the selected flight (or missions to the locked body) shows.">
    <div class="switch" id="focus-switch"></div>
    <span>Focused view</span>
  </label>
  <button type="button" id="glossary-toggle">How do these missions get around?</button>
</div>

<div class="panel" id="size-compare-panel">
  <div class="title">Relative diameters (to scale)</div>
  <div id="size-row"></div>
</div>

<div id="bottom-right-controls">
  <div class="panel" id="time-panel">
    <div class="row">
      <span class="label">Speed</span>
      <span id="speed-readout">1 yr / min</span>
    </div>
    <div class="row">
      <input type="range" id="speed-slider" min="-300" max="300" value="100" step="1">
    </div>
    <div class="row">
      <button id="playpause">Pause</button>
      <button id="reset-speed">Reset speed</button>
    </div>
  </div>

  <!-- Wider than #time-panel above it -- put last (bottom edge, where
       #bottom-right-controls is anchored) so the narrower panel sits on
       top instead of the stack's width visibly stepping out partway up. -->
  <div class="panel" id="date-panel">
    <span class="label">Date</span>
    <input type="date" id="date-input" readonly>
    <button id="edit-date-btn" title="Pause and edit the date directly">Edit</button>
    <button id="apply-date" title="Jump to this date">Go to date</button>
    <button id="cancel-edit-date-btn" title="Cancel editing">✕</button>
    <button id="reset-today">Today</button>
  </div>
</div>

<div class="panel" id="locked-panel">
  <div id="locked-panel-header">
    <div id="locked-panel-header-top">
      <span id="locked-panel-title"></span>
      <button id="locked-panel-close" title="Stop tracking">&times;</button>
    </div>
  </div>
  <div id="locked-panel-body"></div>
</div>

<div class="panel" id="camera-controls">
  <button id="reset-view-btn" title="Restore default rotation, zoom, and pan">Reset view</button>
  <button id="stop-tracking-btn" title="Stop following the locked body">Stop tracking</button>
</div>

<div id="zoom-hint">drag to rotate · shift+drag (or right-drag) to pan · scroll to zoom · click a body to track it</div>

<!-- General "how spacecraft get around" glossary -- independent of
     lockedBodyName/lockBody (see the JS wiring near the legend drawer's),
     so it doesn't touch auto-pause or camera tracking. -->
<div id="glossary-backdrop"></div>
<div class="panel" id="glossary-panel">
  <div id="glossary-panel-header">
    <div id="glossary-panel-header-top">
      <span id="glossary-panel-title">How spacecraft get around</span>
      <button id="glossary-panel-close" title="Close">&times;</button>
    </div>
  </div>
  <div id="glossary-panel-body"></div>
</div>

<!-- "Watch it happen" maneuver demo: a docked caption bar, not a modal --
     the whole point is that the main scene stays visible and playing
     behind it. See startManeuverDemo/exitManeuverDemo in app.js. -->
<div class="panel" id="demo-caption">
  <div id="demo-caption-text"></div>
  <button type="button" id="demo-exit-btn">Exit demo</button>
</div>

<script src="src/js/app.js?v=26"></script>
</body>
</html>
