<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- user-scalable=no hands pinch/pan entirely to the canvas's own touch
     handlers -- without this the page itself would ALSO natively
     pinch-zoom/pan at the same time as the app's custom gesture code,
     fighting it. Without width=device-width at all, mobile browsers fake
     a ~980px viewport and scale the whole page down instead of laying it
     out at the real screen width. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solar System — Orbital Mechanics Visualizer</title>
<!-- Inline SVG data URI, not a separate file -- avoids the browser's
     automatic /favicon.ico request 404ing (a plain static file server
     doesn't rewrite that to anything real). Colors match the app's own
     palette: dark panel background, gold Sun, blue accent planet. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f1a'/%3E%3Cellipse cx='16' cy='17' rx='12' ry='6' fill='none' stroke='%233a4a6b' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='14' r='4.2' fill='%23ffd27a'/%3E%3Ccircle cx='26' cy='17' r='2.1' fill='%235ab0ff'/%3E%3C/svg%3E">
<!-- ?v= cache-buster on both src/js/app.js and src/css/style.css below --
     bump the number on any edit to either file. Both were being served
     with no explicit cache headers, so browsers were free to keep
     serving an old cached copy across normal (non-hard) reloads, which
     is the likely cause of "my fix isn't showing up" reports where the
     source itself checks out fine (verified content missing on some
     panels but not others, exactly the kind of partial staleness a
     cached JS file mid-series-of-edits would produce). -->
<link rel="stylesheet" href="src/css/style.css?v=43">
</head>
<body>

<div id="canvas-wrap">
  <canvas id="scene"></canvas>
</div>

<div id="hover-tip"></div>

<!-- Mobile-only: hidden on desktop (see body.mobile rules in style.css).
     Legend becomes a slide-out drawer on mobile instead of an
     always-visible floating box -- this button plus the backdrop below
     are its open/close affordances. -->
<button id="legend-drawer-toggle" title="Show legend" aria-label="Show legend">
  <span class="drawer-toggle-bar"></span>
  <span class="drawer-toggle-bar"></span>
  <span class="drawer-toggle-bar"></span>
</button>
<div id="legend-backdrop"></div>

<!-- Mobile-only: hidden on desktop (see body.mobile rules in style.css).
     #scale-toggle-panel's own toggles show natively there; on mobile they
     collapse behind this gear button instead, to keep this corner from
     getting crowded as more toggles are added. -->
<button id="settings-drawer-toggle" title="Settings" aria-label="Settings">⚙</button>

<div class="panel" id="legend-panel">
  <div class="layer-group" id="planets-layer-group">
    <div class="layer-header" id="planets-layer-header">
      <span class="chevron"></span><span>Planets</span>
    </div>
    <div class="layer-body" id="planets-layer-body">
      <div id="legend-rows"></div>
    </div>
  </div>
  <div class="layer-group collapsed" id="flights-layer-group">
    <div class="layer-header" id="flights-layer-header">
      <span class="chevron"></span><span>Flights</span>
    </div>
    <div class="layer-body" id="flights-layer-body">
      <div id="flights-rows"></div>
    </div>
  </div>
  <div class="layer-group collapsed" id="smallbodies-layer-group">
    <div class="layer-header" id="smallbodies-layer-header">
      <span class="chevron"></span><span>Small Bodies</span>
    </div>
    <div class="layer-body" id="smallbodies-layer-body">
      <div id="smallbodies-rows"></div>
    </div>
  </div>
</div>

<div class="panel" id="scale-toggle-panel">
  <label id="size-toggle-label">
    <div class="switch" id="size-switch"></div>
    <span>Compare true sizes</span>
  </label>
  <label id="focus-toggle-label" title="Broad: everything currently in transit shows. Focused: only the selected flight (or missions to the locked body) shows.">
    <div class="switch" id="focus-switch"></div>
    <span>Focused view</span>
  </label>
  <label id="orbit-view-toggle-label" title="Full path: the mission's entire trajectory. Current orbit: the one loop it's presently on -- a fading trail 90 degrees behind through a solid path 300 degrees ahead of where it is right now, overlapping slightly so a shift in aphelion/perihelion from a maneuver or gravity assist is easier to spot.">
    <div class="switch" id="orbit-view-switch"></div>
    <span>Current orbit only</span>
  </label>
  <label id="infobox-toggle-label" title="Auto: selecting a flight opens its info panel right away. Manual: selecting a flight shows its path and scrubber only -- use the button next to the flight timeline to open the info panel when you want it.">
    <div class="switch" id="infobox-switch"></div>
    <span>Manual info panel</span>
  </label>
  <label id="free-camera-toggle-label" title="Off: the camera always recenters on whatever's locked/tracked. On: the camera holds still wherever you last put it -- drag/rotate/zoom freely -- even while something is locked, so you can keep a deliberately-chosen framing (e.g. for a screenshot) instead of it recentering on a moving target.">
    <div class="switch" id="free-camera-switch"></div>
    <span>Hold camera frame</span>
  </label>
  <button type="button" id="glossary-toggle">How do these missions get around?</button>
</div>

<div class="panel" id="size-compare-panel">
  <div class="title">Relative diameters (to scale)</div>
  <div id="size-row"></div>
</div>

<div id="bottom-right-controls">
  <div class="panel" id="time-panel">
    <!-- #camera-controls is moved INTO this row via JS (see
         relocateCameraControls in app.js), on mobile only -- it can't just
         live here in the markup: .panel's backdrop-filter creates a new
         containing block for position:fixed descendants (a real, easy-to-
         miss CSS gotcha), which broke #camera-controls' desktop floating
         position the first time this was tried purely via CSS nesting
         (its position:fixed started resolving against this small row
         instead of the viewport). Moving the actual DOM node at the mobile
         breakpoint sidesteps that entirely: on desktop it stays outside
         any .panel-classed ancestor (its original spot, near
         #flight-scrubber-panel), where position:fixed correctly escapes
         to the viewport as intended. -->
    <div class="row" id="speed-row">
      <span class="label">Speed</span>
      <span class="speed-field" id="speed-field" tabindex="0" role="button" title="Click to type a speed">1 yr/min</span>
      <input type="text" class="speed-edit-input" id="speed-edit" size="5">
      <button id="speed-go-btn">Go</button>
    </div>
    <div class="row">
      <input type="range" id="speed-slider" min="-300" max="300" value="100" step="1">
    </div>
    <div class="row">
      <button id="playpause">Pause</button>
      <button id="reset-speed">Reset speed</button>
    </div>
  </div>

  <!-- Wider than #time-panel above it -- put last (bottom edge, where
       #bottom-right-controls is anchored) so the narrower panel sits on
       top instead of the stack's width visibly stepping out partway up. -->
  <div class="panel" id="date-panel">
    <span class="label">Date</span>
    <input type="date" id="date-input" readonly>
    <button id="edit-date-btn" title="Pause and edit the date directly">Edit</button>
    <button id="apply-date" title="Jump to this date">Go to date</button>
    <button id="cancel-edit-date-btn" title="Cancel editing">✕</button>
    <button id="reset-today">Today</button>
  </div>
</div>

<div class="panel" id="locked-panel">
  <div id="locked-panel-header">
    <div id="locked-panel-header-top">
      <span id="locked-panel-title"></span>
      <button id="locked-panel-close" title="Stop tracking">&times;</button>
    </div>
  </div>
  <div id="locked-panel-body"></div>
</div>

<!-- Slides up from the bottom edge alongside the still-visible/still-
     interactive solar system view -- NOT a takeover of the main view like
     every other modal-ish panel in this file (#locked-panel on mobile,
     #glossary-panel). Desktop/laptop only for now (see isMobileLayout
     gating in app.js on #dashboard-toggle-btn, in #camera-controls below)
     -- mobile has enough screen-space pressure already that this needs
     its own, different treatment, deferred for later.
     #dashboard-widgets is a row so more widgets (a "gravigram" net-force
     view is planned) can slot in later without restructuring -- currently
     holds just #hodograph-widget. -->
<div class="panel" id="dashboard-panel">
  <div id="dashboard-panel-header">
    <span id="dashboard-panel-title"></span>
    <button id="dashboard-panel-close" title="Close">&times;</button>
  </div>
  <div id="dashboard-widgets">
    <div class="dashboard-widget" id="hodograph-widget">
      <div class="dashboard-widget-header">
        <span class="dashboard-widget-title">Velocity Hodograph</span>
        <!-- The body this orbit's velocity/GM is measured relative to --
             Sol for almost everything today, but a moon's hodograph is
             relative to its planet, and a geocentric parking-orbit leg
             is relative to Earth (or whichever planet), so this is a
             real per-object field, not a hardcoded "Sol" label, even
             though Sol is what it'll show most of the time right now. -->
        <span class="dashboard-widget-subtitle">orbiting <span id="hodograph-influence-body"></span></span>
      </div>
      <canvas id="hodograph-canvas"></canvas>
      <div id="hodograph-readout"></div>
      <div id="hodograph-empty-state"></div>
    </div>
  </div>
</div>

<div class="panel" id="flight-scrubber-panel">
  <div id="flight-scrubber-header">
    <span id="flight-scrubber-title-group">
      <span id="flight-scrubber-title" title="Click to reopen the info panel"></span>
      <button type="button" id="flight-scrubber-open-info-btn" title="Open the info panel">Show info</button>
    </span>
    <span id="flight-scrubber-dates"></span>
  </div>
  <div id="flight-scrubber-track">
    <div id="flight-scrubber-fill"></div>
    <div id="flight-scrubber-markers"></div>
    <div id="flight-scrubber-playhead"></div>
  </div>
</div>

<div class="panel" id="camera-controls">
  <button id="reset-view-btn" title="Restore default rotation, zoom, and pan">Reset view</button>
  <button id="stop-tracking-btn" title="Stop following the locked body">Stop tracking</button>
  <!-- Desktop/laptop only (see isMobileLayout gating in app.js) -- hidden
       entirely on mobile, not just disabled, until mobile gets its own
       treatment for this. -->
  <button id="dashboard-toggle-btn" title="Open the dashboard (velocity hodograph)">Dashboard</button>
</div>

<div id="zoom-hint">drag to rotate · shift+drag (or right-drag) to pan · scroll to zoom · click a body to track it</div>

<!-- Scene Framing: a live readout of the camera state (zoom/rotation/
     pan/tracking/date), for manually finding and noting down a specific
     shot -- e.g. to reproduce later, or as the source of an eventual
     embed URL's own camera params. Hidden by default, toggled by a
     keyboard shortcut (backtick) -- see app.js. Not tied to any other
     panel's visibility. -->
<div class="panel" id="scene-framing-panel">
  <div class="title">Scene Framing</div>
  <div id="scene-framing-readout"></div>
  <button type="button" id="scene-framing-copy">Copy as URL params</button>
</div>

<!-- General "how spacecraft get around" glossary -- independent of
     lockedBodyName/lockBody (see the JS wiring near the legend drawer's),
     so it doesn't touch auto-pause or camera tracking. -->
<div id="glossary-backdrop"></div>
<div class="panel" id="glossary-panel">
  <div id="glossary-panel-header">
    <div id="glossary-panel-header-top">
      <span id="glossary-panel-title">How spacecraft get around</span>
      <button id="glossary-panel-close" title="Close">&times;</button>
    </div>
  </div>
  <div id="glossary-panel-body"></div>
</div>

<!-- "Watch it happen" maneuver demo: a docked caption bar, not a modal --
     the whole point is that the main scene stays visible and playing
     behind it. See startManeuverDemo/exitManeuverDemo in app.js. -->
<div class="panel" id="demo-caption">
  <div id="demo-caption-text"></div>
  <button type="button" id="demo-exit-btn">Exit demo</button>
</div>

<script src="src/js/app.js?v=74"></script>
</body>
</html>
